name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Stable required PR check — do not rename. Repository secrets are deliberately
  # unavailable to forks; the no-op branch below keeps the check visible and green.
  preview:
    name: preview
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Safely skip fork preview
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo 'Fork previews do not receive Vercel or Neon credentials.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: bun install --frozen-lockfile
      - id: expiry
        name: Set preview branch expiration
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "rfc3339=$(date -u -d '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - id: neon
        name: Create or reuse preview Neon branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: development
          branch_name: pr-${{ github.event.pull_request.number }}
          expires_at: ${{ steps.expiry.outputs.rfc3339 }}
      - name: Mask dynamic Neon URLs
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL_UNPOOLED"
      - name: Apply migrations to preview Neon branch
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bun run db:migrate
      - name: Install Vercel CLI
        if: ${{ steps.neon.outputs.branch_id != '' }}
        run: npm install --global vercel@59.11.7
      - name: Verify Vercel CLI version
        if: ${{ steps.neon.outputs.branch_id != '' }}
        run: vercel --version
      - name: Pull Vercel Preview environment
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview
      - name: Build preview
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build
      - id: deploy
        name: Deploy preview
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          preview_url="$(vercel deploy --prebuilt --yes \
            --env DATABASE_URL="$DATABASE_URL" \
            --env DATABASE_URL_UNPOOLED="$DATABASE_URL_UNPOOLED")"
          printf 'url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
      - name: Publish preview URL for browser quality gates
        if: ${{ steps.deploy.outputs.url != '' }}
        run: |
          mkdir -p .ci-preview
          printf '%s\n' '${{ steps.deploy.outputs.url }}' > .ci-preview/url
      - name: Upload preview URL
        if: ${{ steps.deploy.outputs.url != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-url
          path: .ci-preview/url
          if-no-files-found: error
          retention-days: 1
