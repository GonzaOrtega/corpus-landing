name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Stable required PR check — do not rename. Forks cannot receive deployment
  # credentials, so this required deployment gate fails closed.
  preview:
    name: preview
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Fail closed for fork PRs
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo 'The required Preview deployment cannot run for a fork PR.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: bun install --frozen-lockfile
      - id: expiry
        name: Set preview branch expiration
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "rfc3339=$(date -u -d '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - id: neon
        name: Create or reuse preview Neon branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: development
          # This Neon project's database is corpus_landing, not the action's neondb
          # default. Without these the branch is created and connection lookup 404s.
          database: corpus_landing
          role: corpus_landing_owner
          branch_name: pr-${{ github.event.pull_request.number }}
          expires_at: ${{ steps.expiry.outputs.rfc3339 }}
      - name: Refresh preview branch expiration
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_EXPIRES_AT: ${{ steps.expiry.outputs.rfc3339 }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"branch\":{\"expires_at\":\"%s\"}}' "$NEON_EXPIRES_AT")"
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --output /dev/null \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID"
      - name: Mask dynamic Neon URLs
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL_UNPOOLED"
      - name: Apply migrations to preview Neon branch
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: bun run db:migrate
      - name: Install Vercel CLI
        if: ${{ steps.neon.outputs.branch_id != '' }}
        run: npm install --global vercel@59.11.7
      - name: Verify Vercel CLI version
        if: ${{ steps.neon.outputs.branch_id != '' }}
        run: vercel --version
      - name: Pull Vercel Preview environment
        if: ${{ steps.neon.outputs.branch_id != '' }}
        # Both ids plus a TEAM-scoped token. `pull` and `build` link the project
        # through an owner lookup that a project-scoped token is denied, and the
        # CLI reports that denial as "Could not retrieve Project Settings"
        # regardless of what the ids say. Only `deploy` carries a fallback.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview
      - name: Reject build-time variables Vercel marked Sensitive
        if: ${{ steps.neon.outputs.branch_id != '' }}
        # Sensitive variables are write-only: `vercel pull` cannot decrypt them
        # and writes the literal [SENSITIVE]. Vercel's own builds inject the
        # real value, so this breaks CI builds only, and surfaces far from its
        # cause — SITE_URL as a ZodError while prerendering "/",
        # CORPUS_RELEASE_STAGE as a throw from parseReleaseStage. Names are
        # printed; values never are.
        shell: bash
        run: |
          set -euo pipefail
          masked="$(grep -oP '^[A-Z0-9_]+(?==\"\[SENSITIVE\]\")' .vercel/.env.preview.local || true)"
          [ -n "$masked" ] && printf 'pulled as [SENSITIVE]: %s\n' "$(echo "$masked" | tr '\n' ' ')"
          # CORPUS_DOWNLOAD_URL is only parsed inside the launched branch of
          # loadSiteConfig, so it is inert — and allowed to stay Sensitive —
          # while the pulled stage is early-access.
          stage="$(grep -oP '^CORPUS_RELEASE_STAGE="\K[^"]*' .vercel/.env.preview.local || true)"
          required=(SITE_URL CORPUS_RELEASE_STAGE REPLY_TO EMAIL_POSTAL_ADDRESS)
          [ "$stage" = launched ] && required+=(CORPUS_DOWNLOAD_URL)
          needed="$(comm -12 \
            <(echo "$masked" | sort -u) \
            <(printf '%s\n' "${required[@]}" | sort -u))"
          if [ -n "$needed" ]; then
            echo "These are read while prerendering and cannot be Sensitive in Vercel:" >&2
            printf '  %s\n' $needed >&2
            echo 'Uncheck Sensitive on each; none of them is a secret.' >&2
            exit 1
          fi
          echo 'No build-time variable is masked.'
      - name: Build preview
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build
      - id: deploy
        name: Deploy preview
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          preview_url="$(vercel deploy --prebuilt --yes \
            --env DATABASE_URL="$DATABASE_URL" \
            --env DATABASE_URL_UNPOOLED="$DATABASE_URL_UNPOOLED")"
          printf 'url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
  # Stable required PR check — do not rename. This runs on the pull_request
  # workflow's SHA and can only use the non-secret Preview URL job output.
  e2e:
    name: e2e
    needs: preview
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when preview is unavailable
        if: ${{ needs.preview.result != 'success' }}
        run: |
          echo 'The required Preview deployment did not complete successfully.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.preview.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ needs.preview.result == 'success' }}
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        if: ${{ needs.preview.result == 'success' }}
        run: bun install --frozen-lockfile
      - id: neon
        name: Reuse preview Neon branch for management E2E setup
        if: ${{ needs.preview.result == 'success' }}
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: development
          # This Neon project's database is corpus_landing, not the action's neondb
          # default. Without these the branch is created and connection lookup 404s.
          database: corpus_landing
          role: corpus_landing_owner
          branch_name: pr-${{ github.event.pull_request.number }}
      - name: Mask E2E Neon URLs
        if: ${{ needs.preview.result == 'success' && steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL_UNPOOLED"
      - name: Verify Preview URL
        if: ${{ needs.preview.result == 'success' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.url }}
        run: |
          case "$PLAYWRIGHT_BASE_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Install Playwright browsers
        if: ${{ needs.preview.result == 'success' }}
        run: bunx playwright install --with-deps
      - name: Run Playwright against Preview
        if: ${{ needs.preview.result == 'success' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.url }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun run e2e

  # Stable required PR check — do not rename. The URL comes directly from the
  # Preview job; no artifact download or deployment credential is needed here.
  lighthouse:
    name: lighthouse
    needs: preview
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when preview is unavailable
        if: ${{ needs.preview.result != 'success' }}
        run: |
          echo 'The required Preview deployment did not complete successfully.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.preview.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ needs.preview.result == 'success' }}
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        if: ${{ needs.preview.result == 'success' }}
        run: bun install --frozen-lockfile
      - name: Verify Preview URL
        if: ${{ needs.preview.result == 'success' }}
        env:
          LHCI_URL: ${{ needs.preview.outputs.url }}
        run: |
          case "$LHCI_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Run Lighthouse CI against Preview
        if: ${{ needs.preview.result == 'success' }}
        env:
          LHCI_URL: ${{ needs.preview.outputs.url }}
          LHCI_DEPLOYMENT_ENV: preview
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun run lighthouse
