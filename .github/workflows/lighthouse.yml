name: Lighthouse

on:
  workflow_run:
    workflows: [Preview]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  # Stable required PR check — do not rename. The URL comes from Preview, which
  # is the only workflow allowed to handle Vercel and Neon deployment secrets.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the trusted preview did not finish
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: exit 1
      - name: Safely skip fork preview
        if: ${{ github.event.workflow_run.head_repository.full_name != github.repository }}
        run: echo 'Fork previews do not receive deployment credentials.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
        with:
          bun-version: 1.3.13
      - name: Download preview URL
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          name: preview-url
          run-id: ${{ github.event.workflow_run.id }}
          path: .ci-preview
      - id: preview-url
        name: Read preview URL
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
        run: |
          preview_url="$(<.ci-preview/url)"
          case "$preview_url" in https://*) ;; *) exit 1 ;; esac
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
        run: bun install --frozen-lockfile
      - name: Run Lighthouse CI against preview
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
        env:
          LHCI_URL: ${{ steps.preview-url.outputs.url }}
        run: bun run lighthouse
