name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stable required PR check — do not rename.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Workflow configuration regressions
        run: bun run test tests/unit/migration-workflow-config.test.ts
      - name: Dependency-cruiser
        run: bunx depcruise --config .dependency-cruiser.json src app --output-type err
      - name: Stack conformance
        run: bun run stack:check

  # Stable required PR check — do not rename. Forks cannot receive Neon
  # credentials, so this required database-validation gate fails closed.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Fail closed for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo 'The required Neon integration test cannot run for a fork PR.' >&2
          exit 1
      - id: expiry
        name: Set disposable branch expiration
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "rfc3339=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - id: neon
        name: Create disposable Neon branch
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: development
          # This Neon project's database is corpus_landing, not the action's neondb
          # default. Without these the branch is created and connection lookup 404s.
          database: corpus_landing
          role: corpus_landing_owner
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.rfc3339 }}
      - name: Mask dynamic Neon URLs
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL_UNPOOLED"
      - name: Apply migrations to the disposable Neon branch
        if: ${{ steps.neon.outputs.branch_id != '' }}
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: bun run db:migrate
      # Coverage, not a plain run: this is the only job with a database, so it
      # is the only place the Drizzle repository is measured rather than
      # excluded. `bun run check` runs the same gate locally, so a breached
      # threshold is normally caught before the push rather than here.
      #
      # Deliberately unguarded (unlike the migrate/cleanup steps around it):
      # if the Neon branch outputs came back empty, coverage must fail loudly
      # here rather than silently self-skip the Drizzle repository and pass
      # having measured nothing of the adapter it exists to measure.
      - name: Require the disposable Neon branch before measuring coverage
        env:
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          if [ -z "$NEON_BRANCH_ID" ] || [ -z "$DATABASE_URL" ] || [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo '::error::steps.neon.outputs.branch_id (and/or its db_url / db_url_pooled outputs) is empty: no disposable Neon branch exists, so coverage would only run against no database. Failing the required database-validation check instead of silently excluding the Drizzle repository from measurement.' >&2
            exit 1
          fi
      - name: Run Vitest with coverage
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: bun run test:coverage
      - name: Delete disposable Neon branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
