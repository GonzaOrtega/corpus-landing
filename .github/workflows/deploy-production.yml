name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Lowercase full 40-hex commit SHA currently on main
        required: true
        type: string
      release_stage:
        description: Expected CORPUS_RELEASE_STAGE in the Production build
        required: true
        type: choice
        options:
          - early-access
          - launched

permissions:
  contents: read

concurrency:
  group: corpus-production-release
  cancel-in-progress: false

jobs:
  release:
    # Configure required reviewers and main-only deployment branches in GitHub.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Validate dispatch and authoritative live main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'sha must be a lowercase 40-hex commit ID' >&2; exit 64; }
          [[ "$EXPECTED_SHA" = "$GITHUB_SHA" ]] || { echo 'Requested SHA is not the dispatch event SHA' >&2; exit 1; }
          LIVE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$LIVE_MAIN_SHA" = "$EXPECTED_SHA" ]] || { echo 'Requested SHA is not live main' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies and pinned Vercel CLI
        run: |
          bun install --frozen-lockfile
          npm install --global vercel@59.11.7
      - name: Validate smoke expectations
        env:
          SMOKE_RELEASE_STAGE: ${{ inputs.release_stage }}
          SMOKE_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
          SMOKE_DOWNLOAD_URL: ${{ vars.PRODUCTION_DOWNLOAD_URL }}
        run: bun src/ops/production-smoke.ts --validate
      - name: Recheck main and apply generated production migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          LIVE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$LIVE_MAIN_SHA" = "$EXPECTED_SHA" ]] || { echo 'Main moved; aborting before migration/build' >&2; exit 1; }
          [[ -n "$DATABASE_URL_UNPOOLED" ]] || { echo 'Missing unpooled production database secret' >&2; exit 1; }
          # Driver errors can contain connection strings. Keep raw output out of logs/artifacts.
          if ! bun run db:migrate > "$RUNNER_TEMP/production-migration.log" 2>&1; then
            echo 'Production migration failed; inspect the database using approved private tooling' >&2
            exit 1
          fi
      - name: Pull Production environment and build once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --yes --token="$VERCEL_TOKEN"
      - id: stage
        name: Stage the prebuilt Production artifact without assigning domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --skip-domain --yes --meta "githubCommitSha=$EXPECTED_SHA" --token="$VERCEL_TOKEN")"
          # Only the CLI's captured generated URL may cross the step boundary.
          [[ "$DEPLOY_URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || { echo 'Unexpected deployment URL' >&2; exit 1; }
          printf 'url=%s\n' "$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          vercel inspect "$DEPLOY_URL" --wait --timeout=10m --token="$VERCEL_TOKEN"
      - name: Smoke the immutable staged deployment
        env:
          SMOKE_RELEASE_STAGE: ${{ inputs.release_stage }}
          DEPLOY_URL: ${{ steps.stage.outputs.url }}
          SMOKE_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
          SMOKE_DOWNLOAD_URL: ${{ vars.PRODUCTION_DOWNLOAD_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun src/ops/production-smoke.ts
      - name: Recheck authoritative main and promote the same deployment
        env:
          DEPLOY_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          LIVE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$LIVE_MAIN_SHA" = "$EXPECTED_SHA" ]] || { echo 'Main moved; staged deployment will not be promoted' >&2; exit 1; }
          vercel promote "$DEPLOY_URL" --yes --timeout=5m --token="$VERCEL_TOKEN"
      - name: Record release provenance
        env:
          DEPLOY_URL: ${{ steps.stage.outputs.url }}
          RELEASE_STAGE: ${{ inputs.release_stage }}
        run: |
          printf 'Released commit: `%s`\n\nStage: %s\n\nDeployment: %s\n' "$EXPECTED_SHA" "$RELEASE_STAGE" "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
