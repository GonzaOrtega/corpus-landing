eli5:
  - round: 1
    text: "We added a little warm-up knock before Lighthouse visits the new Preview, but that knock does not have the key needed to enter a protected Preview. The real Lighthouse visitor has that key, so the fix is to give the warm-up visitor the same key. One smaller note says our test should also check the retry settings. Please decide whether to fix the blocked warm-up now; the retry-test improvement can stay for later.\n"
  - round: 2
    text: "The warm-up visitor now carries the same key as the Lighthouse visitor, so both can enter a protected Preview. Three reviewers checked that small change and did not find a new important problem.\n"
  - round: 3
    text: "The warm-up visitor has a secret key. If it follows a sign pointing to someone else's house, it could carry that key there. We should stop it from following redirects, since the Preview address is already the exact page we need to warm.\n"
