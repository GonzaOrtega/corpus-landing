eli5:
  - round: 1
    text: "Four helpers read this change on their own and wrote down twenty-one things. Fifteen are small, and the gate set those aside by itself. Six are big enough that you have to decide about them.\n\nThe most serious one is about hiding email addresses. When something goes wrong, the site writes a note about it and sends that note away to be read by its operators. Before sending, it blanks out anything private. Somebody was making that blanking-out faster and, while doing it, told the email rule to look at only the first sixty-four letters of an address. An address longer than that is now only half hidden: the beginning of it goes out readable. The sign-up form lets people use addresses that long, so this is a real person's address, not an imaginary one. The helper proved it by running the real code, and then checked whether the limit was even needed for speed. It was not. That rule was never the slow one.\n\nTwo are about the little door the site uses to pass browser reports along. If a visitor's browser starts sending a report and then goes away half-way through, the door falls over and nothing is written down about it, even though the door's own note promises that every failure is recorded. The other one: while the site is being tested, the door is told to throw everything away, but it is told in a way that looks exactly like \"nobody ever set this up\". If that ever happened by accident on the real site, every browser report would quietly disappear and nothing would say so.\n\nOne is about signing up. A new shared wrapper was added so that a failure in the monitoring code can never break a visitor's request. It works, but it is a little too eager: if the monitoring part trips after the sign-up has already gone through, the wrapper throws the good result away and tells the visitor it did not work. They sign up again and get a second confirmation mail for a place they already have.\n\nThe last two are missing checks rather than broken behaviour. Nothing proves that the stand-in reporter — the one used when no tracker is set up — was actually handed a working notebook to write in; it quietly ignores a broken one, so the whole point of the fix could stop working with every test still green. And the filter for extra bits attached to log lines only switches on when it sees one exact word copied from an outside library. Nothing anywhere pins that word down, so an update to that library could rename it and switch the filter off without a single test noticing.\n\nWhat you need to decide: for each of the six, whether it gets fixed in this pull request or written down for later. If you want them all done, saying so is enough.\n"
  - round: 2
    text: "The four helpers read the six repairs and wrote down eleven more things. Nine are small. Two are big enough that you have to decide about them.\n\nThe first is an apostrophe. The repair to the address-hiding rule works: an address is now hidden completely however long it is, and one helper checked that by running the new rule against about a million made-up inputs without finding a single case where it hides less than it ought to. But the list of characters the rule treats as part of an address leaves out the apostrophe, and the sign-up form accepts one. A helper tried every single character the form allows, one at a time, and the apostrophe is the only one the form takes and the rule does not know about. For somebody whose address contains one, everything in front of it is sent out readable, which in practice is their whole name. The repair is one character long.\n\nThe second is about the little door that passes browser reports along. The repair made it write a line when it cannot read what a browser sent, which is what we asked for. But the line does not say what went wrong. A visitor closing their tab half-way and the server's own machinery breaking now produce exactly the same line, at a level nobody is watching. So the thing the repair existed to make visible is still hidden, now behind the ordinary case instead of behind nothing.\n\nTwo of the nine small ones are worth knowing about even though the gate set them aside. One of the tests written to prove the first repair works passes just as happily against the unrepaired code, so it does not earn its name; the repair is still properly proven, by the test sitting next to it. And the new warning line about deliberately dropped reports will also show up during an ordinary local speed test, even though the note written directly above it promises it never does.\n\nThis is the last round. Once you answer, the gate freezes: whatever you leave for later stays written down in the ledger, and nothing further gets reviewed before this is merged.\n\nWhat you need to decide: for each of the two, fix it now or leave it for later.\n"
