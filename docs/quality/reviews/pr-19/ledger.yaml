eli5:
  - round: 1
    text: "Four reviewers read this change on their own, without seeing each other's notes. Between them they raised twenty-six things. Sixteen are small and have already been parked for later automatically. Ten are waiting on you.\n\nThe one that matters most: when someone wants to change or cancel their early-access signup, we email them a link with a secret key in it, and that key is the only thing standing between a stranger and that person's record — there are no passwords here, the link *is* the password. The key sits in the tail end of the web address, after the \"#\". This change starts sending crash reports to an outside company, and those reports include the full web address of the page the person was on, tail end included. The code written to wipe secrets out of those reports knows how to spot several shapes of secret, but not that one. So if the manage page breaks in someone's browser before it has had the half-second it needs to tidy the address, their key gets posted to a third party. Two reviewers found this separately. The privacy notice this very change adds to the site currently promises the opposite.\n\nThe second one: this change adds a \"something went wrong\" screen, and that screen asks the crash reporter to write the error down. But the crash reporter is deliberately started late, after the page has finished loading, so that it doesn't slow the site down. A crash during loading therefore happens while the reporter is still asleep, and the note goes nowhere. The screen exists to catch exactly those crashes. Two reviewers found this one too.\n\nOne thing I owe you straight: a third reviewer reported something serious-sounding — that the switches turning off data collection were misspelled and silently doing nothing. It was wrong. It had checked against an older version of the library than this project actually installs. I pulled the real version and read it myself: the switches are correct and they do work. That is R-06 in the list, and my recommendation is that you drop it rather than fix it. I have written the proof into the record so nobody re-raises it next round.\n\nWhat you need to decide: for each of the ten, whether it gets fixed before this merges or pushed to later. You can accept the whole list, or name the ones you want changed. Nothing gets touched until you answer.\n"
  - round: 2
    text: "The same four reviewers read the nine fixes. The good news first: the two things that actually mattered are genuinely fixed, and they checked properly rather than taking anyone's word.\n\nThe secret key can no longer get out. One reviewer built a fake crash report and hid the key in every pocket it could think of — the page address, the \"where did you come from\" field, the trail of what the visitor clicked, the error text itself, the timing records. It ran the real cleaning code over all of it. The key came back blanked out every single time. A second reviewer went at it from the other side, checking the key's own alphabet to make sure it could never contain a character that would let it slip through the net. It can't.\n\nThe \"something went wrong\" screen now reports properly, and — the thing I was most worried about — it does not drag the error tracker in early and slow the page down. Both reviewers confirmed the tracker is still only fetched once something has actually gone wrong.\n\nThe new private mailbox we built to replace the vendor's wide-open one also held up. Two reviewers tried to trick it into forwarding somewhere else using lookalike addresses and malformed input. It refused every time, because it never reads the destination from the request at all — it only ever uses its own.\n\nNow the five things still open, and they are all of the same family: the fixes work, but not enough is watching them.\n\nNobody is told if the new mailbox breaks. If it starts turning messages away, every browser error report stops arriving, and that looks exactly like a quiet week with no problems. That is the one I would not ship without.\n\nAnyone on the internet can post to that mailbox as often as they like, and each post costs us a little hosting money. It is much better than what it replaced, and the provider caps the damage at the far end, but nothing stops the flood at our door.\n\nAnd three tests that look like they are guarding something but are not quite: one checks that the error tracker was switched on but never checks it was switched on with the privacy filters attached; one never proves the mailbox ignores a destination written inside the message itself; and one checks that the speed-test config still contains the right words rather than that it still does the right thing.\n\nTwo smaller notes I have to own up to: two comments in the code and the handbook now contradict each other about whether a local speed test can leak, and the handbook is the one that is right. I told you earlier that one fix had accidentally solved that problem. I was wrong, I checked, and it has not.\n\nWhat you need to decide: this is the last round. Whatever you say fix gets fixed and the gate closes. Whatever you leave becomes a ticket instead of a blocker.\n"
