    text: "Four reviewers read this change on their own, without seeing each other's notes. Between them they raised twenty-six things. Sixteen are small and have already been parked for later automatically. Ten are waiting on you.\n\nThe one that matters most: when someone wants to change or cancel their early-access signup, we email them a link with a secret key in it, and that key is the only thing standing between a stranger and that person's record — there are no passwords here, the link *is* the password. The key sits in the tail end of the web address, after the \"#\". This change starts sending crash reports to an outside company, and those reports include the full web address of the page the person was on, tail end included. The code written to wipe secrets out of those reports knows how to spot several shapes of secret, but not that one. So if the manage page breaks in someone's browser before it has had the half-second it needs to tidy the address, their key gets posted to a third party. Two reviewers found this separately. The privacy notice this very change adds to the site currently promises the opposite.\n\nThe second one: this change adds a \"something went wrong\" screen, and that screen asks the crash reporter to write the error down. But the crash reporter is deliberately started late, after the page has finished loading, so that it doesn't slow the site down. A crash during loading therefore happens while the reporter is still asleep, and the note goes nowhere. The screen exists to catch exactly those crashes. Two reviewers found this one too.\n\nOne thing I owe you straight: a third reviewer reported something serious-sounding — that the switches turning off data collection were misspelled and silently doing nothing. It was wrong. It had checked against an older version of the library than this project actually installs. I pulled the real version and read it myself: the switches are correct and they do work. That is R-06 in the list, and my recommendation is that you drop it rather than fix it. I have written the proof into the record so nobody re-raises it next round.\n\nWhat you need to decide: for each of the ten, whether it gets fixed before this merges or pushed to later. You can accept the whole list, or name the ones you want changed. Nothing gets touched until you answer.\n"
